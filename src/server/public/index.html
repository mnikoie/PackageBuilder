<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="pb-token" content="__PB_TOKEN__" />
<title>PackageBuilder — وضعیتِ واقعی</title>
<link rel="stylesheet" href="/vendor/xterm.css" />
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2128; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e;
    --ok: #3fb950; --ok-bg: #0f2f18;
    --no: #f85149; --no-bg: #3a1214;
    --maybe: #d29922; --maybe-bg: #3a2c0c;
    --accent: #2f81f7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: Vazirmatn, Tahoma, sans-serif; font-size: 14px; line-height: 1.7;
    display: flex; flex-direction: column;
  }
  button, input { font-family: inherit; font-size: inherit; }

  .layout { flex: 1; display: flex; min-height: 0; }
  .left { flex: 1; overflow-y: auto; padding: 20px; min-width: 380px; }
  .right {
    width: 46%; min-width: 380px; display: flex; flex-direction: column;
    background: #0c0c0c; border-inline-start: 1px solid var(--border);
  }
  .term-head {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); font-size: .78rem; color: var(--muted);
  }
  .term-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--no); flex: 0 0 auto; }
  .term-head .dot.on { background: var(--ok); }
  .term-head .spacer { flex: 1; }
  .term-head button {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 10px; font-size: .72rem; cursor: pointer;
  }
  .term-head button:hover { color: var(--text); border-color: var(--accent); }
  #terminal { flex: 1; min-height: 0; padding: 6px; }
  .xterm-viewport::-webkit-scrollbar { width: 11px; }
  .xterm-viewport::-webkit-scrollbar-thumb { background: #444; border-radius: 6px; }
  .xterm-viewport::-webkit-scrollbar-track { background: #0c0c0c; }

  h1 { font-size: 1.15rem; margin: 0 0 4px; }
  .topbar { display: flex; align-items: center; gap: 10px; }
  .topbar h1 { flex: 1; }
  .lang-btn {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 20px; padding: 3px 14px; font-size: .76rem; cursor: pointer;
  }
  .lang-btn:hover { color: var(--accent); border-color: var(--accent); }
  .sub { color: var(--muted); font-size: .82rem; margin-bottom: 18px; }

  .bar { display: flex; gap: 8px; margin-bottom: 6px; }
  .bar input {
    flex: 1; padding: 9px 12px; direction: ltr; text-align: left;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .bar input:focus { outline: none; border-color: var(--accent); }
  .bar button {
    padding: 9px 18px; cursor: pointer; font-weight: 600;
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
  }
  .bar button:hover { filter: brightness(1.1); }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: .78rem; margin-bottom: 18px; }
  .legend b { font-weight: 700; }

  .card { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); margin-bottom: 14px; overflow: hidden; }
  .card > h2 { font-size: .85rem; margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--muted); font-weight: 700; }
  .card > .body { padding: 6px 0; }

  .row { display: flex; align-items: baseline; gap: 10px; padding: 7px 14px; }
  .row:nth-child(even) { background: var(--panel2); }
  .row .label { min-width: 160px; font-weight: 600; }
  .row .why { color: var(--muted); font-size: .8rem; flex: 1; direction: ltr; text-align: right; unicode-bidi: plaintext; }

  .chip { flex: 0 0 auto; font-size: .72rem; font-weight: 700; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }
  .chip.ok    { background: var(--ok-bg);    color: var(--ok); }
  .chip.no    { background: var(--no-bg);    color: var(--no); }
  .chip.maybe { background: var(--maybe-bg); color: var(--maybe); }

  /* سلسله‌مراتبِ appها باید دیده شود — قبلاً ردیف‌های فرزند شبیهِ هم‌رده بودند. */
  .row.app-head { margin-top: 6px; font-weight: 700; }
  .row.app-head .label { font-size: .92rem; }
  .row.child { padding-inline-start: 34px; position: relative; }
  .row.child::before {
    content: ""; position: absolute; inset-inline-start: 18px; top: 0; bottom: 0;
    border-inline-start: 2px solid var(--border);
  }
  .row.child:last-child::before { bottom: 50%; }
  .row.child.na { color: var(--muted); font-size: .78rem; font-style: italic; }

  /* برچسبِ جنسِ app: خاکستری، تا با چیپ‌های وضعیت اشتباه نشود. */
  .kind {
    flex: 0 0 auto; font-size: .68rem; padding: 2px 8px; border-radius: 20px;
    background: #2a2f37; color: var(--muted); font-family: Consolas, monospace;
  }

  /* ---- تصمیم‌ها ---- */
  .cat { border-top: 1px solid #21262d; padding: 10px 14px; }
  .cat:first-child { border-top: none; }
  .cat > .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .cat > .head .name { font-weight: 700; }
  .cat > .head .q { color: var(--muted); font-size: .78rem; }
  .cat .verdict { font-size: .76rem; font-weight: 700; }
  .cat .verdict.chosen { color: var(--ok); }
  .cat .verdict.none { color: var(--muted); }
  .cat .verdict.clash { color: var(--no); }
  .cat .verdict.vague { color: var(--maybe); }

  .opt { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0 7px 16px; }
  .opt + .opt { border-top: 1px dashed #21262d; }
  .opt .body { flex: 1; min-width: 0; }
  .opt .title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .opt .title b { font-weight: 700; }
  .opt .why { color: var(--muted); font-size: .76rem; }
  .opt .prosCons { color: var(--muted); font-size: .74rem; margin-top: 3px; }
  .opt .prosCons .plus { color: var(--ok); }
  .opt .prosCons .minus { color: var(--no); }
  .opt .acts { display: flex; gap: 6px; flex: 0 0 auto; }
  .opt button {
    padding: 4px 12px; font-size: .74rem; font-weight: 600; cursor: pointer;
    border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text);
  }
  .opt button.go { border-color: var(--ok); color: var(--ok); }
  .opt button.undo { border-color: var(--no); color: var(--no); }
  .opt button:hover:not(:disabled) { filter: brightness(1.35); }
  .opt button:disabled { opacity: .35; cursor: not-allowed; }
  .warn-tag { font-size: .68rem; padding: 1px 7px; border-radius: 20px; background: var(--maybe-bg); color: var(--maybe); }
  .busy { color: var(--accent); font-size: .76rem; }

  .empty { color: var(--muted); padding: 10px 14px; font-style: italic; }
  .err { border-color: var(--no); }
  .err > h2 { color: var(--no); border-color: var(--no); }
  .warn-line { color: var(--maybe); font-size: .8rem; padding: 4px 14px 10px; }
  .note { color: var(--muted); font-size: .78rem; padding: 4px 14px 10px; }
  .mono { font-family: Consolas, monospace; direction: ltr; unicode-bidi: plaintext; }
  /* ---------------------------------------------------------- گروه‌بندی */
  /*
   * هر دسته یک کارتِ مستقل شد. قبلاً همه در یک کارتِ بلند پشتِ‌هم بودند و
   * مرزِ گروه‌ها گم می‌شد — کاربر گفت «گروه‌بندی را شکیل کن».
   */
  .group { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); margin-bottom: 12px; overflow: hidden; }
  .group.settled { border-color: #23482f; }
  .group > .ghead {
    display: flex; align-items: center; gap: 10px; padding: 11px 14px;
    background: var(--panel2); border-bottom: 1px solid var(--border);
  }
  .group > .ghead .gname { font-weight: 700; font-size: .95rem; }
  .group > .ghead .gq { color: var(--muted); font-size: .76rem; flex: 1; min-width: 0; }
  .group > .gbody { padding: 4px 0; }
  .group > .ghead { cursor: pointer; user-select: none; }
  .group > .ghead .caret { color: var(--muted); font-size: .8rem; transition: transform .15s; }
  .group.closed > .gbody { display: none; }
  .group.closed > .ghead .caret { transform: rotate(-90deg); display: inline-block; }

  .verdict-pill { font-size: .74rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .verdict-pill.chosen { background: var(--ok-bg); color: var(--ok); }
  .verdict-pill.none   { background: #22272e; color: var(--muted); }
  .verdict-pill.clash  { background: var(--no-bg); color: var(--no); }
  .verdict-pill.vague  { background: var(--maybe-bg); color: var(--maybe); }

  /* دکمهٔ راهنما — گِرد و کم‌رنگ تا شلوغی نسازد */
  .info-btn {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    font-size: .74rem; font-weight: 700; line-height: 1; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .info-btn:hover { color: var(--accent); border-color: var(--accent); }

  .opt.installed { background: rgba(63,185,80,.05); }
  .opt .badge-installed {
    font-size: .7rem; font-weight: 700; padding: 2px 9px; border-radius: 20px;
    background: var(--ok-bg); color: var(--ok); white-space: nowrap;
  }

  /* ------------------------------------------------------------- مودال */
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.66); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    max-width: 640px; width: 100%; max-height: 82vh; display: flex; flex-direction: column;
    box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  .modal > header {
    display: flex; align-items: center; gap: 10px; padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .modal > header h3 { margin: 0; font-size: 1rem; flex: 1; }
  .modal > header .x {
    background: transparent; border: none; color: var(--muted); font-size: 1.3rem;
    cursor: pointer; line-height: 1; padding: 0 4px;
  }
  .modal > header .x:hover { color: var(--text); }
  .modal > .mbody { padding: 16px 18px; overflow-y: auto; }
  .modal > footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-start; }
  .secret { margin: 14px 0; }
  .secret label { display: block; font-size: .8rem; margin-bottom: 6px; }
  .secret-line { display: flex; gap: 8px; }
  .secret-line input {
    flex: 1; font-family: ui-monospace, Consolas, monospace; font-size: .8rem;
    padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); direction: ltr; text-align: left;
  }
  .secret-line button {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: .78rem; white-space: nowrap;
  }
  .secret-line button:hover { color: var(--text); }
  .secret-name {
    font-family: ui-monospace, Consolas, monospace; font-size: .68rem;
    color: var(--muted); margin-top: 5px; direction: ltr; text-align: left;
  }
  .secret-note { font-size: .75rem; color: var(--muted); margin-top: 16px; line-height: 1.7; }
  .modal footer button {
    padding: 7px 18px; border-radius: 8px; cursor: pointer; font-weight: 600;
    border: 1px solid var(--border); background: transparent; color: var(--text);
  }
  .modal footer button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modal.danger > header { color: var(--no); }

  .modal .lead { margin: 0 0 14px; line-height: 1.9; }
  .modal h4 { margin: 16px 0 6px; font-size: .82rem; color: var(--muted); font-weight: 700; }
  .modal h4:first-child { margin-top: 0; }
  .modal ul { margin: 0; padding-inline-start: 20px; }
  .modal li { margin: 3px 0; }
  .modal li.plus::marker { color: var(--ok); }
  .modal li.minus::marker { color: var(--no); }
  .modal .kv { display: flex; gap: 8px; padding: 3px 0; font-size: .84rem; }
  .modal .kv .k { color: var(--muted); min-width: 96px; }
  .modal pre {
    background: #0d1117; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: 6px 0 0;
    font-family: Consolas, monospace; font-size: .78rem; direction: ltr; text-align: left;
  }

  /* -------------------------------------------------------------- توست */
  #toasts { position: fixed; inset-block-end: 18px; inset-inline-end: 18px; z-index: 60; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--panel); border: 1px solid var(--border); border-inline-start: 4px solid var(--ok);
    border-radius: 10px; padding: 10px 14px; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,.45);
    animation: slidein .18s ease-out;
  }
  .toast.warn { border-inline-start-color: var(--maybe); }
  .toast .t-title { font-weight: 700; font-size: .84rem; }
  .toast .t-text { color: var(--muted); font-size: .78rem; margin-top: 2px; }
  @keyframes slidein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* --------------------------------------------------- نوارِ ساختِ پروژه */
  .make {
    border: 1px dashed var(--accent); border-radius: 12px; padding: 14px;
    background: rgba(47,129,247,.06); margin-bottom: 14px;
  }
  .make .mtitle { font-weight: 700; margin-bottom: 4px; }
  .make .mtext { color: var(--muted); font-size: .8rem; margin-bottom: 10px; }
  .make button {
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;
    background: var(--accent); color: #fff; border: none;
  }
  .step { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); margin-bottom: 8px; padding: 10px 12px; }
  .step.done { opacity: .55; border-color: #23482f; }
  .step .shead { display: flex; align-items: center; gap: 8px; }
  .step .stitle { font-weight: 700; flex: 1; }
  .step .swhy { color: var(--muted); font-size: .78rem; margin: 4px 0 8px; }
  .step pre {
    background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    margin: 0 0 8px; overflow-x: auto; font-family: Consolas, monospace; font-size: .76rem;
    direction: ltr; text-align: left; white-space: pre-wrap; word-break: break-all;
  }
  .step .sacts { display: flex; gap: 6px; align-items: center; }
  .step .sacts button {
    padding: 4px 12px; font-size: .74rem; font-weight: 600; cursor: pointer; border-radius: 6px;
    border: 1px solid var(--border); background: transparent; color: var(--text);
  }
  .step .sacts button.run { border-color: var(--accent); color: var(--accent); }
  .step .sacts button:disabled { opacity: .4; cursor: not-allowed; }
  .step .sacts label { color: var(--muted); font-size: .74rem; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .step .manual-tag { font-size: .68rem; padding: 1px 7px; border-radius: 20px; background: var(--maybe-bg); color: var(--maybe); }

  .stale-bar {
    border: 1px solid var(--maybe); background: var(--maybe-bg); color: var(--maybe);
    border-radius: 10px; padding: 9px 14px; margin-bottom: 12px; font-size: .8rem;
  }

  .ro { margin-top: 22px; color: var(--muted); font-size: .76rem; border-top: 1px solid var(--border); padding-top: 12px; }
</style>
</head>
<body>

<div id="toasts"></div>

<div class="layout">
  <div class="left">
    <div class="topbar">
      <h1 id="appTitle">وضعیتِ واقعیِ پروژه</h1>
      <button id="langBtn" class="lang-btn">English</button>
    </div>
    <div class="sub" id="appSub">وضعیت فقط خوانده می‌شود.</div>

    <div class="bar">
      <input id="path" type="text" spellcheck="false" />
      <button id="go">بررسی</button>
    </div>
    <div class="legend">
      <span><span class="chip ok">✓</span> <b id="lgYes"></b></span>
      <span><span class="chip no">✗</span> <b id="lgNo"></b></span>
      <span><span class="chip maybe">؟</span> <b id="lgMaybe"></b></span>
    </div>

    <div id="makeHost"></div>
    <div id="decisions"></div>
    <div id="finish"></div>
    <div id="out"></div>

    <div class="ro" id="footNote"></div>
  </div>

  <div class="right">
    <div class="term-head">
      <span class="dot" id="termDot"></span>
      <span id="termLabel"></span>
      <span class="spacer"></span>
      <button id="termClear"></button>
    </div>
    <div id="terminal"></div>
  </div>
</div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script>
  // ------------------------------------------------------------ دو زبانه
  //
  // متن‌های ثابتِ صفحه اینجا هستند؛ برچسب و توضیحِ تکنولوژی‌ها از سرور
  // می‌آید (src/core/i18n.mjs). جمله‌های «مدرک» عمداً ترجمه نمی‌شوند: آنها
  // خروجیِ لحظه‌ایِ لایهٔ تشخیص‌اند و دست‌بردن در متنشان یعنی دست‌بردن در مدرک.
  const LANG_KEY = "pb-lang";
  let LANG = localStorage.getItem(LANG_KEY) === "en" ? "en" : "fa";

  const DICT = {
    fa: {
      title: "وضعیتِ واقعیِ پروژه",
      sub: "وضعیت فقط خوانده می‌شود. هر فرمانی که اجرا شود، در ترمینالِ کنار دیده می‌شود.",
      pathPlaceholder: "مسیرِ پوشهٔ پروژه — مثلاً ./my-app یا یک مسیرِ کامل",
      check: "بررسی",
      legendYes: "مدرک دیدیم که هست",
      legendNo: "مدرک دیدیم که نیست",
      legendMaybe: "نتوانستیم بپرسیم",
      footer: "«نامعلوم» با «نیست» یکی نیست. اگر Docker بالا نباشد، وضعیتِ سرویس‌ها نامعلوم است — نه «نصب نیست».",
      termConnecting: "ترمینال — در حالِ اتصال…",
      termClear: "پاک‌کردنِ نمایش",
      langBtn: "English",
      install: "نصب کن",
      remove: "بردار",
      installed: "از قبل نصب است",
      unverified: "نصبش آزمایش‌نشده",
      needsFirst: "اول لازم است",
      notChosen: "— انتخاب نشده",
      unknown: "؟ نامعلوم",
      clash: "⚠ چند گزینه همزمان",
      running: "در حالِ اجرا…",
      pathNeeded: "مسیرِ یک پوشه را بده.",
      checking: "در حالِ بررسی…",
      makeTitle: "این پوشه هنوز اسکلتِ پروژه ندارد",

      makeBtn: "اسکلتِ پروژه را بساز",
      makeModal: "ساختِ اسکلتِ پروژه",
      makeLead: "چند فایلِ پایه ساخته می‌شود و یک مخزنِ گیت راه می‌افتد. هیچ تکنولوژی‌ای انتخاب نمی‌شود — آن‌ها را بعداً خودت می‌زنی.",
      path: "مسیر",
      displayName: "نامِ نمایشیِ پروژه (اختیاری)",
      namePlaceholder: "پیش‌فرض: نامِ خودِ پوشه",
      create: "بساز",
      cancel: "بی‌خیال",
      secretsTitle: "رمزها",
      secretsLead: "این‌ها هم در .env می‌نشینند هم در فایلِ compose. پیش‌فرض تصادفی است و همین‌طور گذاشتنش درست است.",
      secretsNote: "مقدارِ واقعی فقط در .env می‌رود که کامیت نمی‌شود؛ در .env.example جای‌نگه‌دار می‌نشیند.",
      secretsGo: "نصب کن",
      regenerate: "دوباره بساز",
      ok: "فهمیدم",
      close: "بستن",
      groupHelp: "توضیحِ این گروه",
      optHelp: "توضیحِ این گزینه",
      whatItDecides: "این تصمیم چه چیزی را مشخص می‌کند",

  const T = (k) => DICT[LANG][k] ?? DICT.fa[k] ?? k;

  function applyLang() {
    document.documentElement.lang = LANG;
    document.documentElement.dir = LANG === "en" ? "ltr" : "rtl";
    $("appTitle").textContent = T("title");
    $("appSub").textContent = T("sub");
    $("path").placeholder = T("pathPlaceholder");
    $("go").textContent = T("check");
    $("lgYes").textContent = T("legendYes");
    $("lgNo").textContent = T("legendNo");
    $("lgMaybe").textContent = T("legendMaybe");
    $("footNote").textContent = T("footer");
    $("termClear").textContent = T("termClear");
    $("langBtn").textContent = T("langBtn");
  }

  const $ = (id) => document.getElementById(id);
  const CHIP = { present: ["ok", "✓"], absent: ["no", "✗"], unknown: ["maybe", "؟"] };

  // توکنِ همین صفحه. سرور آن را هنگامِ سِرو کردن تزریق می‌کند و صفحهٔ بیگانه
  // نمی‌تواند بخواندش — پس فقط از داخلِ همین صفحه می‌شود فرمان اجرا کرد.
  const TOKEN = document.querySelector('meta[name="pb-token"]').content;

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };

  // ------------------------------------------------------ مودال و توست
  //
  // چرا alert کنار گذاشته شد: alert کلِ مرورگر را قفل می‌کند، متنِ بلند را بد
  // نشان می‌دهد، و برای موفقیتِ ساده هم مزاحم است. حالا:
  //   • خطا و هشدار → مودال (باید دیده و بسته شود)
  //   • موفقیت      → توست (خودش می‌رود، جلوی کار را نمی‌گیرد)

  let openModal = null;

  function closeModal() {
    if (openModal) { openModal.remove(); openModal = null; }
  }

  /**
   * مودال. `build` بدنه را می‌سازد تا هر جور محتوایی بشود گذاشت.
   */
  /** رمزِ تصادفی، همان‌جا در مرورگر. سرور دخالتی ندارد. */
  function makeSecret(length) {
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const bytes = new Uint32Array(length);
    crypto.getRandomValues(bytes);
    // فقط حرف و رقم: کاراکترِ خاص داخلِ DATABASE_URL ساختارِ URL را می‌شکند.
    return Array.from(bytes, (n) => alphabet[n % alphabet.length]).join("");
  }

  /**
   * پرسیدنِ رمزها قبل از نصب.
   *
   * پیش‌فرض تصادفی است تا کاربر مجبور نباشد چیزی از خودش دربیاورد، ولی
   * می‌تواند عوضش کند. مقدار در همان لحظه هم به `.env` می‌رود هم به فایلِ
   * compose، پس دیگر جایی `change-me` جا نمی‌ماند.
   */
  function askSecrets(opt) {
    const asked = (opt.secrets || []).filter((x) => !x.fixed);
    if (!asked.length) return Promise.resolve({});

    return new Promise((resolve) => {
      const inputs = new Map();
      let done = false;

      modal(`${opt.label} — ${T("secretsTitle")}`, (b) => {
        b.append(el("p", "lead", T("secretsLead")));
        for (const sec of asked) {
          const row = el("div", "secret");
          row.append(el("label", null, sec.label));
          const line = el("div", "secret-line");
          const input = document.createElement("input");
          input.type = "text";
          input.spellcheck = false;
          input.value = makeSecret(sec.length);
          const again = el("button", null, T("regenerate"));
          again.addEventListener("click", () => { input.value = makeSecret(sec.length); });
          line.append(input, again);
          row.append(line);
          row.append(el("div", "secret-name", sec.name));
          b.append(row);
          inputs.set(sec.name, input);
        }
        b.append(el("div", "secret-note", T("secretsNote")));
      }, {
        actions: [
          {
            label: T("secretsGo"),
            primary: true,
            onClick: () => {
              done = true;
              const out = {};
              for (const [name, input] of inputs) out[name] = input.value.trim();
              resolve(out);
            },
          },
          { label: T("cancel"), onClick: () => { done = true; resolve(null); } },
        ],
      });

      // بستن با × یا Escape هم یعنی انصراف، نه نصب با مقدارِ ناخواسته.
      const watcher = setInterval(() => {
        if (done) return clearInterval(watcher);
        if (!document.querySelector(".backdrop")) {
          clearInterval(watcher);
          done = true;
          resolve(null);
        }
      }, 120);
    });
  }

  function modal(title, build, { danger = false, actions = null } = {}) {
    closeModal();
    const back = el("div", "backdrop");
    const box = el("div", "modal" + (danger ? " danger" : ""));

    const head = document.createElement("header");
    head.append(el("h3", null, title));
    const x = el("button", "x", "×");
    x.setAttribute("aria-label", T("close"));
    x.addEventListener("click", closeModal);
    head.append(x);

    const body = el("div", "mbody");
    build(body);

    const foot = document.createElement("footer");
    if (actions) {
      for (const a of actions) {
        const b = el("button", a.primary ? "primary" : null, a.label);
        b.addEventListener("click", () => { closeModal(); a.onClick && a.onClick(); });
        foot.append(b);
      }
    } else {
      const b = el("button", "primary", T("ok"));
      b.addEventListener("click", closeModal);
      foot.append(b);
    }

    box.append(head, body, foot);
    back.append(box);
    back.addEventListener("click", (e) => { if (e.target === back) closeModal(); });
    document.body.append(back);
    openModal = back;
    return back;
  }

  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  /** پیامِ کوتاهِ موفقیت. خودش بعد از چند ثانیه می‌رود. */
  function toast(title, text, { warn = false, ms = 6000 } = {}) {
    const t = el("div", "toast" + (warn ? " warn" : ""));
    t.append(el("div", "t-title", title));
    if (text) t.append(el("div", "t-text", text));
    $("toasts").append(t);
    setTimeout(() => t.remove(), ms);
  }

  /** فهرستِ ساده در مودال. */
  function bullets(parent, items, cls) {
    const ul = document.createElement("ul");
    for (const it of items) {
      const li = el("li", cls, it);
      ul.append(li);
    }
    parent.append(ul);
  }

  function row(label, res) {
    const r = el("div", "row");
    const [cls, caption] = CHIP[res.state] || ["maybe", "؟"];
    r.append(el("span", "chip " + cls, caption), el("span", "label", label), el("span", "why", res.evidence || ""));
    return r;
  }

  function card(title, children, cls = "") {
    const c = el("div", "card " + cls);
    c.append(el("h2", null, title));
    const body = el("div", "body");
    for (const child of children) body.append(child);
    c.append(body);
    return c;
  }

  function render(probe) {
    const out = $("out");
    out.textContent = "";

    if (!probe.exists || !probe.isDirectory) {
      out.append(card("مسیر", [el("div", "empty", probe.error + " — " + probe.path)], "err"));
      return;
    }

    out.append(el("div", "sub mono", probe.path));

    // اسکلت اولین کارِ هر پروژه است، پس بالای صفحه می‌نشیند نه لای گزارش.
    const makeHost = $("makeHost");
    makeHost.textContent = "";
    if (probe.scaffolded && probe.scaffolded.state !== "present") {
      const box = el("div", "make");
      box.append(el("div", "mtitle", T("makeTitle")));
      box.append(el("div", "mtext", T("makeText")));
      const btn = el("button", null, T("makeBtn"));
      btn.addEventListener("click", () => askAndScaffold(probe.path));
      box.append(btn);
      makeHost.append(box);
    }

    // «وابستگی‌های ریشه» ردیفِ جدا شد: قبلاً فقط داخلِ متنِ مدرکِ «رانتایمِ Node»
    // پنهان بود و کاربر نمی‌فهمید node_modulesِ ریشه دیده شده یا نه.
    // وضعیتش از دادهٔ سرور می‌آید، نه از تفسیرِ متنِ مدرک.
    out.append(card("پایه — خودِ ریشهٔ پروژه", [
      row("ساختهٔ PackageBuilder", probe.scaffolded),
      row("مخزنِ گیت", probe.git),
      row("رانتایمِ Node", probe.nodeRuntime),
      row("وابستگی‌های ریشه", probe.rootDeps),
      row("مدیرِ پکیج", probe.packageManager),
      row("ابزارِ مونوریپو", probe.monorepo),
    ]));

    // ---- appها
    //
    // این بخش قبلاً گیج‌کننده بود و کاربر درست ایراد گرفت:
    //  • ردیف‌های زیرِ هر app، شبیهِ هم‌ردهٔ خودش دیده می‌شدند نه زیرمجموعه‌اش
    //  • برچسبِ جنس (node / node+python) رنگِ سبزِ وضعیت داشت، پس «هست» خوانده می‌شد
    //  • «نبودنِ ردیفِ پایتون» یعنی «به این app مربوط نیست»، ولی نامرئی بود
    const appRows = probe.apps.length
      ? probe.apps.flatMap((app) => {
          const rows = [];

          const head = el("div", "row app-head");
          head.append(
            el("span", "kind", app.kind),           // خاکستری، نه سبز — این وضعیت نیست
            el("span", "label", `apps/${app.name}`),
          );
          rows.push(head);

          const child = (label, res, hint) => {
            const r = row(label, res);
            r.classList.add("child");
            if (hint) r.querySelector(".label").title = hint;
            return r;
          };

          if (app.nodeDeps) rows.push(child("وابستگی‌های Node", app.nodeDeps));
          if (app.pythonEnv) rows.push(child("محیطِ پایتون (.venv)", app.pythonEnv));

          // «مربوط نیست» را صریح می‌گوییم، تا سکوت تفسیر نشود.
          if (!app.pythonEnv && app.kinds.includes("node")) {
            rows.push(el("div", "row child na", "محیطِ پایتون — به این app مربوط نیست (پایتونی نیست)"));
          }
          if (!app.nodeDeps && app.kinds.includes("python")) {
            rows.push(el("div", "row child na", "وابستگی‌های Node — به این app مربوط نیست"));
          }
          return rows;
        })
      : [el("div", "empty", "پوشهٔ apps وجود ندارد یا خالی است.")];
    out.append(card("appها — هر ردیفِ تودررفته، مالِ همان appِ بالای خودش است", appRows));

    // ---- Docker
    const d = probe.docker;
    const dockerChildren = [];
    if (!d.file) {
      dockerChildren.push(el("div", "empty", "فایلِ compose پیدا نشد، پس Docker پرسیده نشد."));
    } else {
      const info = el("div", "row");
      info.append(el("span", "label", "فایلِ compose"), el("span", "why mono", d.file));
      dockerChildren.push(info);

      const nameRow = el("div", "row");
      nameRow.append(el("span", "label", "نامِ پروژهٔ Docker"), el("span", "why mono", d.projectName || "(تعریف نشده)"));
      dockerChildren.push(nameRow);

      dockerChildren.push(el("div", d.projectName ? "note" : "warn-line",
        d.projectName
          ? "دامنه بر اساسِ همین نام است، نه مسیرِ پوشه. دو کپی با نامِ یکسان، وضعیتِ هم را نشان می‌دهند."
          : "⚠ بدونِ name، دامنه از نامِ پوشه می‌آید و کپی‌های پروژه به هم قِلق می‌دهند."));

      const services = Object.entries(d.services);
      if (services.length === 0) dockerChildren.push(el("div", "empty", "سرویسی در فایلِ compose تعریف نشده."));
      for (const [name, res] of services) dockerChildren.push(row(name, res));
    }
    out.append(card("Docker", dockerChildren));

    // ---- تصمیم‌های اعلام‌شده
    const stack = probe.declared && probe.declared.stack;
    const chosen = stack ? Object.entries(stack).filter(([, v]) => v !== null) : [];
    const declChildren = [];
    if (!probe.declared) {
      declChildren.push(el("div", "empty", "project.config.json وجود ندارد."));
    } else if (probe.declared._parseError) {
      declChildren.push(el("div", "empty", "project.config.json خوانده نشد: " + probe.declared._parseError));
    } else if (chosen.length === 0) {
      declChildren.push(el("div", "empty", "هنوز هیچ تکنولوژی‌ای انتخاب نشده."));
    } else {
      for (const [k, v] of chosen) {
        const r = el("div", "row");
        r.append(el("span", "label mono", k), el("span", "why", String(v)));
        declChildren.push(r);
      }
    }
    declChildren.push(el("div", "note", "این‌ها «قصد»اند، نه «واقعیت» — فقط می‌گویند چه چیزی انتخاب شده."));
    out.append(card("تصمیم‌های اعلام‌شده", declChildren));

    // ---- ناسازگاری
    if (probe.mismatches.length) {
      const rows = probe.mismatches.map((m) => {
        const r = el("div", "row");
        const cls = m.severity === "conflict" ? "no" : "maybe";
        r.append(
          el("span", "chip " + cls, m.severity === "conflict" ? "✗ نمی‌خواند" : "؟ نامعلوم"),
          el("span", "label mono", m.field),
          el("span", "why", `اعلام «${m.declared}» — واقعیت: ${m.reality}`),
        );
        return r;
      });
      out.append(card("اعلام با واقعیت نمی‌خواند", rows, "err"));
    }
  }

  // ------------------------------------------------------------- تصمیم‌ها

  /** همان چیزی که CLI نشان می‌دهد: چه چیزی از یک اعمالِ شکست‌خورده مانده. */
  function leftovers(steps) {
    const out = [];
    for (const st of steps || []) {
      if (st.kind === "writeFile" && st.changed) out.push(`فایلِ ساخته‌شده: ${st.path}`);
      else if (st.kind === "mkdir" && st.changed) out.push(`پوشهٔ ساخته‌شده: ${st.path}`);
      else if (st.kind === "pnpmWorkspace" && st.changed) out.push("pnpm-workspace.yaml نوشته یا کامل شد");
      else if (st.kind === "cli" && st.ok) out.push(`فرمانی که اجرا شد: ${st.command}`);
      else if (st.kind === "composeUp" && st.ok) out.push(`سرویسِ بالا آمده: ${st.service}`);
      else if (st.kind === "env" && st.changed) out.push(`متغیرهای env: ${(st.added || []).join("، ")}`);
    }
    return out;
  }

  /** گروهِ یک گزینه — برای باز نگه‌داشتنِ همان گروه بعد از نصب. */
  let lastStack = null;
  const groupOf = (techId) => {
    for (const c of (lastStack ? lastStack.categories : [])) {
      if (c.options.some((o) => o.id === techId)) return c.id;
    }
    return null;
  };

  let busy = false;

  /** یک تصمیم را اعمال یا برمی‌گرداند. فرمان‌ها در ترمینالِ کنار دیده می‌شوند. */
  async function decide(kind, path, techId, label, btn, opt = null) {
    if (busy) return;

    // رمزها قبل از هر کاری پرسیده می‌شوند — بعد از شروعِ نصب دیگر دیر است.
    let secrets = {};
    if (kind === "apply" && opt && (opt.secrets || []).some((x) => !x.fixed)) {
      secrets = await askSecrets(opt);
      if (secrets === null) return;
    }

    busy = true;
    const original = btn.textContent;
    btn.textContent = T("running");
    btn.disabled = true;

    try {
      const res = await fetch("/api/" + kind, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-pb-token": TOKEN },
        body: JSON.stringify({ path, tech: techId, secrets }),
      });
      const r = await res.json();

      if (!r.ok) {
        // شکست باید دیده و بسته شود، پس مودال.
        modal(`${T("failed")} — ${label}`, (b) => {
          b.append(el("p", "lead", r.error));
          if (r.snippet) {
            b.append(el("h4", null, T("addYourself")));
            const pre = document.createElement("pre");
            pre.textContent = r.snippet;
            b.append(pre);
          }
          if (r.needs && r.needs.length) {
            b.append(el("h4", null, T("installFirst")));
            bullets(b, r.needs);
          }
          const left = leftovers(r.steps);
          if (left.length) {
            b.append(el("h4", null, T("leftovers")));
            bullets(b, left);
            b.append(el("div", null, T("leftoversNote")));
          }
        }, { danger: true });
      } else if (r.alreadyPresent) {
        // این حالت قبلاً عملاً نامرئی بود.
        toast(`${label} — ${T("installed")}`, r.evidence, { warn: true });
      } else {
        const verb = kind === "apply" ? T("installedVerb") : T("removedVerb");
        toast(`✓ ${label} ${verb}`, r.evidence);

        // نکته‌هایی که کاربر **باید** ببیند، توست نیستند.
        const notes = [];
        if (kind === "apply" && !r.verified) notes.push(T("noEvidence"));
        if (r.manualSteps && r.manualSteps.length) notes.push(...r.manualSteps);
        if (notes.length) {
          modal(`${label} — ${T("noteSuffix")}`, (b) => {
            b.append(el("p", "lead", `${verb} — ${T("notesLead")}`));
            bullets(b, notes);
          });
        }
      }
    } catch (err) {
      modal(T("serverUnreachable"), (b) => b.append(el("p", "lead", err.message)), { danger: true });
    } finally {
      busy = false;
      btn.textContent = original;
      btn.disabled = false;
      // بعد از نصب، همان گروه باز بماند و بقیه بسته.
      openGroup = groupOf(techId);
      stackCache.clear(); // وضعیت عوض شده؛ کشِ کهنه دیگر مدرک نیست
      loadDecisions();
      loadFinish();
      load();
    }
  }

  /** راهنمای یک گروه: توضیحِ جامع + فهرستِ گزینه‌ها با وضعیتشان. */
  function showCategoryHelp(cat) {
    modal(cat.label, (body) => {
      body.append(el("p", "lead", cat.description || cat.question));

      body.append(el("h4", null, T("whatItDecides")));
      body.append(el("div", null, cat.question));

      body.append(el("h4", null, `${T("options")} (${cat.options.length})`));
      const ul = document.createElement("ul");
      for (const o of cat.options) {
        const li = document.createElement("li");
        const [, caption] = CHIP[o.state] || ["maybe", "؟"];
        li.append(el("b", null, o.label), document.createTextNode(` — ${caption}`));
        ul.append(li);
      }
      body.append(ul);

      if (cat.foundational) {
        body.append(el("h4", null, T("noteLabel")));
        body.append(el("div", null, T("foundational")));
      }
    });
  }

  /** راهنمای یک پکیج: مزیت‌ها، عیب‌ها، مدرک، و دقیقاً چه اتفاقی می‌افتد. */
  function showOptionHelp(cat, opt) {
    modal(opt.label, (body) => {
      const [cls, caption] = CHIP[opt.state] || ["maybe", "؟"];

      const kv = (k, v) => {
        const d = el("div", "kv");
        d.append(el("span", "k", k), el("span", null, v));
        body.append(d);
      };

      kv(T("state"), caption);
      kv(T("evidence"), opt.evidence || "—");
      kv(T("group"), cat.label);
      if (opt.requires && opt.requires.length) kv(T("requires"), opt.requires.join("، "));
      if (!opt.verified) kv(T("warning"), T("unverifiedLong"));

      if (opt.meta && opt.meta.pros && opt.meta.pros.length) {
        body.append(el("h4", null, T("why")));
        bullets(body, opt.meta.pros, "plus");
      }
      if (opt.meta && opt.meta.cons && opt.meta.cons.length) {
        body.append(el("h4", null, T("caveats")));
        bullets(body, opt.meta.cons, "minus");
      }

      if (opt.installs && opt.installs.length) {
        body.append(el("h4", null, T("whatHappens")));
        const pre = document.createElement("pre");
        pre.textContent = opt.installs.join("\n");
        body.append(pre);
      }

      if (opt.removal) {
        body.append(el("h4", null, T("howRevert")));
        if (opt.removal.lines && opt.removal.lines.length) {
          const pre = document.createElement("pre");
          pre.textContent = opt.removal.lines.join("\n");
          body.append(pre);
        }
        if (opt.removal.note) body.append(el("div", null, opt.removal.note));
        if (!opt.removal.lines.length && !opt.removal.note) body.append(el("div", null, "—"));
      }
    });
  }

  // فقط یک گروه در هر لحظه باز است.
  let openGroup = null;

  function renderDecisions(path, stack, freshness) {
    lastStack = stack;
    const host = $("decisions");
    host.textContent = "";

    // اگر رجیستری بعد از بالا آمدنِ سرور عوض شده، صفحه نسخهٔ کهنه را نشان
    // می‌دهد. سکوت درباره‌اش دو بار وقت گرفت تا معلوم شود گزینه گم نشده.
    if (freshness && freshness.stale) {
      host.append(el("div", "stale-bar", T("stale")));
    }

    for (const cat of stack.categories) {
      const chosenOpt = cat.options.find((o) => o.id === cat.chosen);
      const box = el("div", "group" + (chosenOpt ? " settled" : ""));

      const head = el("div", "ghead");
      head.append(el("span", "caret", "▾"));
      head.append(el("span", "gname", cat.label));

      const help = el("button", "info-btn", "؟");
      help.title = T("groupHelp");
      help.addEventListener("click", (e) => { e.stopPropagation(); showCategoryHelp(cat); });
      head.append(help);

      head.append(el("span", "gq", cat.question));

      if (cat.conflict) {
        head.append(el("span", "verdict-pill clash", `${T("clash")}: ${cat.conflict.join("، ")}`));
      } else if (chosenOpt) {
        head.append(el("span", "verdict-pill chosen", `✓ ${chosenOpt.label}`));
      } else if (cat.uncertain) {
        head.append(el("span", "verdict-pill vague", T("unknown")));
      } else {
        head.append(el("span", "verdict-pill none", T("notChosen")));
      }
      box.append(head);

      const gbody = el("div", "gbody");
      for (const opt of cat.options) {
        const installed = opt.state === "present";
        const blocked = opt.missingRequirements.length > 0;

        const o = el("div", "opt" + (installed ? " installed" : ""));
        const body = el("div", "body");

        const title = el("div", "title");
        const [cls, caption] = CHIP[opt.state] || ["maybe", "؟"];
        title.append(el("span", "chip " + cls, caption), el("b", null, opt.label));

        const oHelp = el("button", "info-btn", "؟");
        oHelp.title = T("optHelp");
        oHelp.addEventListener("click", () => showOptionHelp(cat, opt));
        title.append(oHelp);

        // «از قبل نصب است» باید دیده شود، نه اینکه فقط دکمه خاموش باشد.
        // کاربر درست گفت: «چیزی نمی‌گوید که نصب است و نمی‌خواهد نصب کنی».
        if (installed) title.append(el("span", "badge-installed", T("installed")));
        if (!opt.verified) title.append(el("span", "warn-tag", T("unverified")));
        if (blocked) title.append(el("span", "warn-tag", `${T("needsFirst")}: ${opt.missingRequirements.join("، ")}`));

        body.append(title);
        body.append(el("div", "why", opt.evidence));

        // مزیت و عیب فقط در مودالِ راهنما — اینجا شلوغی می‌ساخت.
        o.append(body);

        const acts = el("div", "acts");
        const goBtn = el("button", "go", T("install"));
        goBtn.disabled = installed || blocked || !termReady;
        goBtn.title = !termReady
          ? T("termNotReady")
          : installed ? T("installed") : blocked ? T("needPrereq") : "";
        goBtn.addEventListener("click", () => decide("apply", path, opt.id, opt.label, goBtn, opt));

        const undoBtn = el("button", "undo", T("remove"));
        undoBtn.disabled = !installed || !termReady;
        if (!termReady) undoBtn.title = T("termNotReady");
        undoBtn.addEventListener("click", () => decide("revert", path, opt.id, opt.label, undoBtn));

        acts.append(goBtn, undoBtn);
        o.append(acts);
        gbody.append(o);
      }
      box.append(gbody);

      // فقط گروهِ اول باز است؛ بقیه با کلیک. و بعد از هر نصب که صفحه دوباره
      // ساخته می‌شود، هر گروهی که باز بوده باز می‌ماند — وگرنه کاربر جایش را
      // گم می‌کند.
      const isFirst = host.querySelectorAll(".group").length === 0;
      const open = openGroup ? openGroup === cat.id : isFirst;
      if (!open) box.classList.add("closed");
      head.addEventListener("click", () => {
        const wasClosed = box.classList.contains("closed");
        for (const g of host.querySelectorAll(".group")) g.classList.add("closed");
        if (wasClosed) { box.classList.remove("closed"); openGroup = cat.id; }
        else openGroup = null;
      });

      host.append(box);
    }
  }

  /**
   * ساختِ اسکلت، با پرسیدنِ نامِ نمایشی.
   *
   * روی پوشهٔ پُر عمداً امتناع می‌شود (خودِ هسته این را می‌گوید) تا کارِ
   * کسی پاک نشود؛ اینجا فقط پیامش را خوانا نشان می‌دهیم.
   */
  function askAndScaffold(path) {
    let nameInput;
    modal(T("makeModal"), (b) => {
      b.append(el("p", "lead", T("makeLead")));
      b.append(el("h4", null, T("path")));
      b.append(el("div", "mono", path));
      b.append(el("h4", null, T("displayName")));
      nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.placeholder = T("namePlaceholder");
      nameInput.style.cssText = "width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text)";
      b.append(nameInput);
    }, {
      actions: [
        { label: T("create"), primary: true, onClick: () => doScaffold(path, nameInput ? nameInput.value.trim() : "") },
        { label: T("cancel") },
      ],
    });
  }

  async function doScaffold(path, name) {
    try {
      const res = await fetch("/api/new", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-pb-token": TOKEN },
        body: JSON.stringify({ path, name: name || undefined }),
      });
      const r = await res.json();

      if (!r.ok) {
        modal(T("notCreated"), (b) => {
          b.append(el("p", "lead", r.error));
          b.append(el("div", null, T("notCreatedNote")));
        }, { danger: true });
        return;
      }

      toast(T("scaffolded"), `${r.files.length} ${T("files")} — ${r.git.committed ? T("gitOk") : T("gitNo")}`);
      load();
      loadDecisions();
    } catch (err) {
      modal(T("serverUnreachable"), (b) => b.append(el("p", "lead", err.message)), { danger: true });
    }
  }

  // جوابِ هر زبان کش می‌شود تا تعویضِ زبان فوری باشد. کلید، مسیر و زبان.
  const stackCache = new Map();
  const cacheKey = (path, lang) => lang + "|" + path;

  // ------------------------------------------------------ قدم‌های پایانی
  //
  // انتخابِ تکنولوژی پروژه را آماده می‌کند، ولی هنوز اجرا نمی‌شود: .env واقعی
  // ساخته نشده، کلیدها خالی‌اند، سرویس‌ها بالا نیامده‌اند. این بخش همان
  // فاصله را پر می‌کند — و هیچ‌چیز را خودکار اجرا نمی‌کند.

  const doneKey = (path) => "pb-done|" + path;
  const readDone = (path) => {
    try { return new Set(JSON.parse(localStorage.getItem(doneKey(path)) || "[]")); } catch { return new Set(); }
  };
  const writeDone = (path, set) => localStorage.setItem(doneKey(path), JSON.stringify([...set]));

  function renderFinish(path, steps) {
    const host = $("finish");
    host.textContent = "";
    if (!steps.length) return;

    const marked = readDone(path);
    const children = [];

    for (const st of steps) {
      const isDone = st.done || marked.has(st.id);
      const box = el("div", "step" + (isDone ? " done" : ""));

      const head = el("div", "shead");
      head.append(el("span", "chip " + (isDone ? "ok" : "no"), isDone ? "✓" : "✗"));
      head.append(el("span", "stitle", st.title));
      if (st.manual) head.append(el("span", "manual-tag", T("manualStep")));
      box.append(head);

      box.append(el("div", "swhy", st.why));

      const pre = document.createElement("pre");
      pre.textContent = st.command;
      box.append(pre);

      const acts = el("div", "sacts");

      const copyBtn = el("button", null, T("copy"));
      copyBtn.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(st.command); toast(T("copied"), st.title); } catch { /* بی‌اهمیت */ }
      });
      acts.append(copyBtn);

      const runBtn = el("button", "run", T("runIt"));
      runBtn.disabled = !termReady;
      if (!termReady) runBtn.title = T("termNotReady");
      runBtn.addEventListener("click", async () => {
        runBtn.disabled = true;
        try {
          await fetch("/api/run", {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-pb-token": TOKEN },
            body: JSON.stringify({ command: st.command }),
          });
        } catch (err) {
          modal(T("serverUnreachable"), (b) => b.append(el("p", "lead", err.message)), { danger: true });
        } finally {
          runBtn.disabled = false;
        }
      });
      acts.append(runBtn);


      // علامتِ دستی — برای قدم‌هایی که مدرکِ خودکار ندارند (مثلِ پر کردنِ کلید).
      const label = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = marked.has(st.id);
      cb.addEventListener("change", () => {
        const set = readDone(path);
        if (cb.checked) set.add(st.id); else set.delete(st.id);
        writeDone(path, set);
        loadFinish();
      });
      label.append(cb, document.createTextNode(T("doneMark")));
      acts.append(label);

      box.append(acts);
      children.push(box);
    }

    host.append(card(T("finishTitle"), children));
  }

  async function loadFinish() {
    const path = $("path").value.trim();
    const host = $("finish");
    if (!path) { host.textContent = ""; return; }
    try {
      const r = await fetch("/api/finish?path=" + encodeURIComponent(path));
      const data = await r.json();
      if (!data.ok) { host.textContent = ""; return; }
      renderFinish(path, data.steps);
    } catch {
      host.textContent = "";
    }
  }

  async function loadDecisions({ useCache = false } = {}) {
    const path = $("path").value.trim();
    const host = $("decisions");
    if (!path) { host.textContent = ""; return; }

    const key = cacheKey(path, LANG);
    if (useCache && stackCache.has(key)) {
      const c = stackCache.get(key);
      renderDecisions(path, c.stack, c.freshness);
      return;
    }

    try {
      const r = await fetch("/api/stack?lang=" + LANG + "&path=" + encodeURIComponent(path));
      const data = await r.json();
      if (!data.ok) { host.textContent = ""; return; }
      stackCache.set(key, { stack: data.stack, freshness: data.freshness });
      renderDecisions(path, data.stack, data.freshness);
    } catch {
      host.textContent = "";
    }
  }

  async function load() {
    const path = $("path").value.trim();
    const out = $("out");
    if (!path) { out.textContent = ""; out.append(el("div", "empty", T("pathNeeded"))); return; }

    out.textContent = "";
    out.append(el("div", "empty", T("checking")));
    try {
      const r = await fetch("/api/probe?path=" + encodeURIComponent(path));
      const data = await r.json();
      if (!data.ok) { out.textContent = ""; out.append(card("خطا", [el("div", "empty", data.error)], "err")); return; }
      render(data.probe);
    } catch (err) {
      out.textContent = "";
      out.append(card("خطا", [el("div", "empty", "درخواست به سرور نرسید: " + err.message)], "err"));
    }
  }

  $("go").addEventListener("click", () => { stackCache.clear(); load(); loadFinish(); loadDecisions().then(prefetchOtherLang); });

  /** زبانِ دیگر را بی‌صدا می‌گیریم تا تعویض بعداً فوری باشد. */
  async function prefetchOtherLang() {
    const path = $("path").value.trim();
    const other = LANG === "fa" ? "en" : "fa";
    const key = cacheKey(path, other);
    if (!path || stackCache.has(key)) return;
    try {
      const r = await fetch("/api/stack?lang=" + other + "&path=" + encodeURIComponent(path));
      const data = await r.json();
      if (data.ok) stackCache.set(key, { stack: data.stack, freshness: data.freshness });
    } catch { /* بی‌اهمیت — فقط پیش‌گرفتن بود */ }
  }

  // تعویضِ زبان: انتخاب ذخیره می‌شود و صفحه از نو با همان زبان ساخته می‌شود.
  $("langBtn").addEventListener("click", async () => {
    LANG = LANG === "fa" ? "en" : "fa";
    localStorage.setItem(LANG_KEY, LANG);
    applyLang();

    // اگر این زبان قبلاً گرفته شده، همان لحظه رندر می‌شود؛ وگرنه یک درخواستِ
    // سبک. گزارشِ probe اصلاً دوباره گرفته نمی‌شود — متنش عوض نمی‌شود.
    await loadDecisions({ useCache: true });
    loadFinish();
  });

  applyLang();
  $("path").addEventListener("keydown", (e) => { if (e.key === "Enter") { stackCache.clear(); load(); loadFinish(); loadDecisions().then(prefetchOtherLang); } });

  let timer = null;
  $("path").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { stackCache.clear(); load(); loadFinish(); loadDecisions(); }, 500); });

  // ---------------------------------------------------------------- ترمینال

  const term = new Terminal({
    fontFamily: "'Cascadia Mono', Consolas, monospace",
    fontSize: 13, cursorBlink: true, scrollback: 10000,
    theme: {
      background: "#0c0c0c", foreground: "#cccccc", cursor: "#cccccc",
      black: "#0c0c0c", red: "#c50f1f", green: "#13a10e", yellow: "#c19c00",
      blue: "#0037da", magenta: "#881798", cyan: "#3a96dd", white: "#cccccc",
      brightBlack: "#767676", brightRed: "#e74856", brightGreen: "#16c60c", brightYellow: "#f9f1a5",
      brightBlue: "#3b78ff", brightMagenta: "#b4009e", brightCyan: "#61d6d6", brightWhite: "#f2f2f2",
    },
  });
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open($("terminal"));
  // صریح در دسترس می‌گذاریمش تا تستِ سرتاسری بتواند محتوای واقعیِ ترمینال را
  // بخواند و ثابت کند فرمان‌ها پنهان اجرا نشده‌اند.
  window.term = term;
  // اندازه را بعد از چیده‌شدنِ صفحه حساب کن، وگرنه ستون/سطر غلط درمی‌آید و
  // نوارهای پیشرفت (که با \r بازنویسی می‌کنند) خط‌خطی می‌شوند.
  requestAnimationFrame(() => fitAddon.fit());
  window.addEventListener("resize", () => fitAddon.fit());
  $("termClear").addEventListener("click", () => term.clear());

  function setTermStatus(on, label) {
    $("termDot").classList.toggle("on", on);
    $("termLabel").textContent = label;
    // دکمه‌های اعمال/برگشت تا وصل‌شدنِ ترمینال خاموش می‌مانند: فرمانی که
    // خروجی‌اش دیده نشود، ناقضِ قاعدهٔ «هیچ چیزی پنهان اجرا نشود» است.
    // (این را تستِ سرتاسری پیدا کرد: کلیکِ قبل از اتصال، خروجی را می‌بلعید.)
    if (termReady !== on) { termReady = on; loadDecisions({ useCache: true }); }
  }

  const pendingSteps = new Map();
  let ws = null;
  let termReady = false;

  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${proto}//${location.host}/pty?token=${encodeURIComponent(TOKEN)}`);

    ws.addEventListener("open", () => {
      fitAddon.fit();
      ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
      fetch("/api/terminal-info")
        .then((r) => r.json())
        .then((d) => setTermStatus(true, `${LANG === "en" ? "Live terminal" : "ترمینالِ واقعی"} — ${d.shell || "pwsh"}`))
        .catch(() => setTermStatus(true, LANG === "en" ? "Live terminal" : "ترمینالِ واقعی"));
    });

    ws.addEventListener("message", (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "data") {
        term.write(msg.data);
      } else if (msg.type === "stepResult") {
        const entry = pendingSteps.get(msg.id);
        if (!entry) return;
        pendingSteps.delete(msg.id);
        entry.resolve(msg);
        if (pendingSteps.size === 0) load(); // وضعیت را از نو بخوان
      }
    });

    ws.addEventListener("close", () => {
      setTermStatus(false, "ترمینال قطع شد — در حالِ اتصالِ دوباره…");
      setTimeout(connect, 1500);
    });
    ws.addEventListener("error", () => setTermStatus(false, "خطا در اتصالِ ترمینال"));
  }

  const send = (msg) => ws?.readyState === WebSocket.OPEN && ws.send(JSON.stringify(msg));
  term.onData((data) => send({ type: "input", data }));
  term.onResize(({ cols, rows }) => send({ type: "resize", cols, rows }));
  connect();

  /**
   * اجرای فرمان در همان ترمینالِ قابلِ دیدن.
   * @returns {Promise<{ ok: boolean, reason?: string }>}
   */
  async function runCommand(command) {
    const res = await fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-pb-token": TOKEN },
      body: JSON.stringify({ command }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);

    return new Promise((resolve) => {
      pendingSteps.set(data.stepId, { resolve });
      // ضامنِ ضدِ معطلی: اگر خبرِ پایان به هر دلیلی نرسید، بعدِ مدتی رها کن.
      setTimeout(() => {
        if (pendingSteps.has(data.stepId)) {
          pendingSteps.delete(data.stepId);
          resolve({ ok: false, reason: "خبرِ پایان نرسید" });
          load();
        }
      }, 15 * 60 * 1000);
    });
  }
  window.pbRun = runCommand; // قدمِ ۷ از همین استفاده می‌کند

  // مسیر در آدرسِ صفحه هم قابلِ دادن است: /?path=...
  const fromUrl = new URLSearchParams(location.search).get("path");
  if (fromUrl) { $("path").value = fromUrl; load(); loadFinish(); loadDecisions().then(prefetchOtherLang); }
</script>
</body>
</html>
